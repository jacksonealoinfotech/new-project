services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-starter-app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=FastAPI Production Template
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_db
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=development-insecure-secret-key-32-chars-minimum-length-for-testing
      - JWT_SECRET_KEY=development-insecure-jwt-secret-key-minimum-32-characters-needed
      - ALLOWED_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - ALLOWED_HOSTS=*
      - LOG_LEVEL=INFO
      - LOG_FORMAT=console
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: fastapi-starter-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fastapi_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fastapi-starter-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
